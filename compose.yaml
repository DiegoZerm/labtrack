name: labtrack

x-application: &application
  build:
    context: .
    target: runtime
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-labtrack}:${POSTGRES_PASSWORD:?Ejecuta scripts/init_env.py}@db:5432/${POSTGRES_DB:-labtrack}
    ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://127.0.0.1:8010","http://localhost:8010"]}'
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    SESSION_HOURS: ${SESSION_HOURS:-8}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-}
  init: true
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta scripts/init_env.py}
      POSTGRES_DB: ${POSTGRES_DB:-labtrack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *application
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *application
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  test-db:
    profiles: ["test"]
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: labtrack_test
      POSTGRES_PASSWORD: isolated-test-password
      POSTGRES_DB: labtrack_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labtrack_test -d labtrack_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://labtrack_test:isolated-test-password@test-db:5432/labtrack_test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres-data:
