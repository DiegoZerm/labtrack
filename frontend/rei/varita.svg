<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Varita mágica">
  <title>Varita mágica</title>
  <defs>
  <filter id="sticker" x="-25%" y="-25%" width="150%" height="150%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="4" result="grueso"/>
    <feFlood flood-color="#ffffff"/><feComposite in2="grueso" operator="in" result="borde"/>
    <feGaussianBlur in="grueso" stdDeviation="4" result="difuso"/><feOffset in="difuso" dy="3" result="bajo"/>
    <feFlood flood-color="#9d8fd0" flood-opacity="0.28"/><feComposite in2="bajo" operator="in" result="sombra"/>
    <feMerge><feMergeNode in="sombra"/><feMergeNode in="borde"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="plata" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f7fa"/><stop offset="0.5" stop-color="#c9ccd6"/><stop offset="1" stop-color="#eceef3"/></linearGradient>
  <linearGradient id="estrella" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9ddf5"/><stop offset="1" stop-color="#f5dce5"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#e9ddf5" stop-opacity="0"/></radialGradient>
  </defs>
  <g filter="url(#sticker)">
