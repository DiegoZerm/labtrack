    <line x1="48" y1="170" x2="120" y2="82" stroke="url(#plata)" stroke-width="9" stroke-linecap="round"/>
    <line x1="52" y1="164" x2="116" y2="86" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="58" y1="158" x2="66" y2="148" stroke="#e9ddf5" stroke-width="11" stroke-linecap="butt"/>
    <line x1="71" y1="142" x2="77" y2="134" stroke="#f5dce5" stroke-width="11" stroke-linecap="butt"/>
    <polygon points="132.0,30.0 140.8,51.9 164.3,53.5 146.3,68.6 152.0,91.5 132.0,79.0 112.0,91.5 117.7,68.6 99.7,53.5 123.2,51.9" fill="url(#estrella)" stroke="#cdb8e6" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="128.0,43.7 132.0,53.5 142.6,54.3 134.4,61.1 137.0,71.4 128.0,65.8 119.0,71.4 121.6,61.1 113.4,54.3 124.0,53.5" fill="#ffffff" opacity="0.7"/>
